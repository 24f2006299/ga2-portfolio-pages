name: ga2-cache-prime

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  cache-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: cache-66fea85
      - name: prime-cache-66fea85
        run: echo "cache hit = ${{ steps.cache-deps.outputs.cache-hit }}"
